<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Placement Prep Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>📘 PlacementPrep</h1>

            <h2>Login</h2>

            <p>Login to access your placement progress.</p>

            <form id="login-form">

                <input
                    type="email"
                    id="login-email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

    <script src="auth.js"></script>

</body>

</html>
